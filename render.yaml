services:
  - type: web
    name: shazam-backend
    env: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false # Set this to your PostgreSQL connection string (e.g., from Neon, Supabase, or Render Postgres)
      - key: SPOTIPY_CLIENT_ID
        sync: false # Get this from Spotify Developer Dashboard
      - key: SPOTIPY_CLIENT_SECRET
        sync: false # Get this from Spotify Developer Dashboard
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: shazam-frontend
    env: static
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        sync: false # Set this manually to your backend's URL
